server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/atenas
    username: documentacion_user
    password: ${DOCUMENTACION_DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/atenas/protocol/openid-connect/certs

atenas:
  clientes:
    catedra:
      url: http://ms-catedra:8080
