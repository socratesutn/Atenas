spring:
  datasource:
    url: "jdbc:h2:mem:seguimiento;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS seguimiento"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/realms/atenas/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            client-id: atenas-seguimiento-job
            client-secret: ${KC_SEGUIMIENTO_JOB_SECRET:}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:8081/realms/atenas/protocol/openid-connect/token
