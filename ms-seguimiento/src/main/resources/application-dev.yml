server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/atenas
    username: seguimiento_user
    password: ${SEGUIMIENTO_DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/realms/atenas/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: atenas-seguimiento-job
            client-secret: ${KC_SEGUIMIENTO_JOB_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:8081/realms/atenas/protocol/openid-connect/token

atenas:
  clientes:
    catedra:
      url: http://localhost:8082
    documentacion:
      url: http://localhost:8083
